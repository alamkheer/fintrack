<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="FinTrack - Personal Finance" />
    <meta name="description" content="A high-end, editorial personal budget manager for intentional wealth management." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fintrack.app/" />
    <meta property="og:title" content="FinTrack - Personal Finance" />
    <meta property="og:description" content="A high-end, editorial personal budget manager for intentional wealth management." />
    <meta property="og:image" content="/social-preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fintrack.app/" />
    <meta property="twitter:title" content="FinTrack - Personal Finance" />
    <meta property="twitter:description" content="A high-end, editorial personal budget manager for intentional wealth management." />
    <meta property="twitter:image" content="/social-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
